packages:
  - .
  - ui
  - packages/*
  - extensions/*

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  # Except esbuild from the 48h supply-chain hold so the GHSA-gv7w-rqvm-qjhr
  # security patch (0.28.1, published 2026-06-11) can land now instead of
  # waiting out the gate. Covers the platform-specific @esbuild/* optionals.
  - "esbuild"
  - "@esbuild/*"
  - "@openclaw/fs-safe@0.3.0"
  - "@openclaw/proxyline@0.3.3"
  - "acpx"
  - "tokenjuice"
  - "@agentclientprotocol/claude-agent-acp@0.39.0"
  - "@agentclientprotocol/sdk"
  - "axios"
  - "basic-ftp"
  - "baileys@7.0.0-rc13"
  - "hono"
  - "libopus-wasm@0.2.0"
  - "libsignal@6.0.0"
  - "openclaw"
  - "protobufjs"
  - "vite"
  - "vitest"
  - "@vitest/browser"
  - "@vitest/browser-playwright"
  - "@vitest/coverage-v8"
  - "@cloudflare/workers-types"
  - "@hono/node-server"
  - "@mariozechner/*"
  - "@aws-sdk/client-bedrock-runtime@3.1053.0"
  - "@aws-sdk/client-bedrock@3.1053.0"
  - "@aws-sdk/client-cognito-identity@3.1053.0"
  - "@aws-sdk/client-s3@3.1053.0"
  - "@aws-sdk/core"
  - "@aws-sdk/credential-providers@3.1053.0"
  - "@aws-sdk/s3-request-presigner@3.1053.0"
  - "@aws-sdk/token-providers@3.1052.0"
  - "@aws-sdk/token-providers@3.1053.0"
  - "@copilotkit/aimock@1.27.1"
  - "@earendil-works/pi-tui"
  - "@google/genai@2.6.0"
  - "@larksuiteoapi/node-sdk@1.66.0"
  - "@microsoft/teams.api@2.0.12"
  - "@microsoft/teams.apps@2.0.12"
  - "@microsoft/teams.cards@2.0.12"
  - "@microsoft/teams.common@2.0.12"
  - "@microsoft/teams.graph@2.0.12"
  - "@openai/codex"
  - "@openai/codex-*"
  - "@pierre/diffs@1.2.3"
  - "@smithy/shared-ini-file-loader@4.5.4"
  - "@typescript/native-preview*"
  - "@types/node"
  - "@rolldown/*"
  - "@oxlint/*"
  - "@oxfmt/*"
  - "@oxc-project/types"
  - "oxfmt"
  - "axios@1.15.0"
  - "discord-api-types"
  - "rolldown"
  - "sqlite-vec"
  - "sqlite-vec-*"
  - "rastermill"
  - "clawpdf"

nodeLinker: hoisted
blockExoticSubdeps: true

overrides:
  "@anthropic-ai/sdk": 0.100.1
  "@aws-sdk/core": 3.974.13
  "@aws-sdk/credential-provider-node": 3.972.52
  "@aws-sdk/xml-builder": 3.972.25
  hono: 4.12.25 # GHSA-88fw-hqm2-52qc: CORS reflects any Origin w/ credentials on wildcard default (<4.12.25)
  "@hono/node-server": 1.19.14
  axios: 1.16.0
  fast-uri: 3.1.2
  follow-redirects: 1.16.0
  defu: 6.1.5
  fast-xml-parser: 5.7.0
  request: "npm:@cypress/request@3.0.10"
  request-promise: "npm:@cypress/request-promise@5.0.0"
  basic-ftp: 6.0.1
  file-type: 22.0.1
  form-data: 2.5.6 # GHSA-hmw2-7cc7-3qxx: CRLF injection via unescaped multipart field/file names (<2.5.6)
  ip-address: 10.2.0
  minimatch: 10.2.5
  path-to-regexp: 8.4.0
  qs: 6.15.2
  node-domexception: "npm:@nolyfill/domexception@1.0.28"
  typebox: 1.1.39
  tar: 7.5.16 # GHSA-vmf3-w455-68vh: PAX size override on GNU long-name headers desyncs extraction (<=7.5.15)
  tough-cookie: 4.1.3
  yauzl: 3.2.1
  # GHSA-wcpc-wj8m-hjx6 (Any-expansion DoS <=8.4.0) + GHSA-94rc-8x27-4472 (unknown-field
  # memory amplification <=8.4.2) + GHSA-f38q-mgvj-vph7 (schema-derived name shadowing <=8.5.0).
  protobufjs: 8.6.0
  # GHSA-8988-4f7v-96qf: unbounded memory allocation in W3C Baggage propagation (<2.8.0)
  "@opentelemetry/core": 2.8.0
  uuid: 14.0.0
  # GHSA-vmh5-mc38-953g + GHSA-38rv-x7px-6hhq + GHSA-vxpw-j846-p89q + GHSA-hm92-r4w5-c3mj:
  # undici SOCKS5 TLS cert-validation bypass + WebSocket DoS via fragment
  # bypass. Patch each major line in place (8.x affected <8.5.0; 7.x affected <7.28.0).
  "undici@8": 8.5.0
  "undici@7": 7.28.0
  # Security: GHSA-gv7w-rqvm-qjhr (esbuild missing binary integrity verification
  # in the Deno module -> RCE via NPM_CONFIG_REGISTRY). Affects >=0.17.0 <0.28.1;
  # transitive via vite/vitest/tsx. Pin to the patched release.
  esbuild: 0.28.1
  # Security: GHSA-fx2h-pf6j-xcff (vite server.fs.deny bypass on Windows alternate
  # paths, <=8.0.15). Pin to the patched release.
  vite: 8.0.16
  # Security: GHSA-g8mr-85jm-7xhm (@vitest/browser Browser Mode API can proxy CDP
  # and overwrite config files -> RCE, <=4.1.7). Pin to the patched release.
  "@vitest/browser": 4.1.9

allowBuilds:
  "@openclaw/fs-safe": true
  "@google/genai": true
  "@lydell/node-pty": true
  "@matrix-org/matrix-sdk-crypto-nodejs": true
  "@tloncorp/api": true
  "@tloncorp/tlon-skill": true
  baileys: true
  authenticate-pam: true
  "@discordjs/opus": false
  esbuild: true
  koffi: false
  node-llama-cpp: true
  protobufjs: true
  tree-sitter-bash: false
  openclaw: true
  "@openclaw/proxyline": true
  clawpdf: true
  rastermill: true

packageExtensions:
  baileys:
    peerDependenciesMeta:
      sharp:
        optional: true

patchedDependencies:
  "@agentclientprotocol/claude-agent-acp@0.39.0": patches/@agentclientprotocol__claude-agent-acp@0.39.0.patch
